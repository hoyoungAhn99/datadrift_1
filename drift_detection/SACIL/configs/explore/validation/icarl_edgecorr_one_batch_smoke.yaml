extends: ../cifar100/icarl_edgecorr_r2_lambda5.yaml

device: cpu
disable_tqdm: true

training:
  batch_size: 128
  num_workers: 0
  pin_memory: false
  persistent_workers: false
  base:
    epochs: 1
    lr: 0.01
    momentum: 0.0
    weight_decay: 0.0
    scheduler: multistep
    milestones: []
    lr_decay: 0.1
  incremental:
    # One optimizer batch per epoch. The second epoch observes topology drift
    # caused by the first CE+KD update, so the edge term becomes non-zero.
    epochs: 2
    lr: 0.01
    momentum: 0.0
    weight_decay: 0.0
    scheduler: multistep
    milestones: []
    lr_decay: 0.1

debug:
  max_sessions: 2
  max_batches_per_epoch: 1
  record_edge_gradient_norm: true
  train_samples_per_class: 2
  test_samples_per_class: 2

output:
  directory: outputs/explore/validation
  run_name: icarl_edgecorr_one_batch_smoke
