extends: icarl_feature_cosine_lucir_balanced_replay.yaml

# Global prototype-consolidation control. Old replay features are attracted to
# frozen teacher memory prototypes, directly matching the NME evaluation state.
method:
  prototype_consolidation:
    enabled: true
    lambda: 1.0
    conflict_weight: 1.0
    outside_weight: 1.0

output:
  directory: outputs/explore/prototype_consolidation
  run_name: icarl_feature_cosine_lucir_balanced_replay_proto_c100_b50_inc5_r32
