seed: 1
deterministic: true
device: cuda:1

data:
  name: cifar100
  root: datasets
  protocol: experiment_configs/class_orders/cifar100_b50_t10_afc_order1.json
  download: false

model:
  backbone: resnet32
  classifier_scale: 10.0
  learnable_scale: true

memory:
  exemplars_per_class: 20
  selection: herding

method:
  name: logit_kd_topkd
  lambda_geo: 0.0
  logit_kd:
    temperature: 4.0
    weight: 1.0
  topology:
    ripsnet_checkpoint: outputs/ripsnet_cifar100_resnet32_h0/seed_1/best.pt
    weight: 1.0

training:
  batch_size: 128
  num_workers: 4
  pin_memory: true
  persistent_workers: true
  base:
    epochs: 160
    lr: 0.1
    momentum: 0.9
    weight_decay: 0.0005
    nesterov: true
    milestones: [80, 120]
    gamma: 0.1
  incremental:
    epochs: 80
    lr: 0.05
    momentum: 0.9
    weight_decay: 0.0005
    nesterov: true
    milestones: [40, 60]
    gamma: 0.1

output:
  directory: outputs
  run_name: cifar100_logit_kd_topkd_b50_inc5_20260729
