seed: 1
deterministic: true
device: cuda:0

data:
  name: cifar100
  root: datasets
  protocol: experiment_configs/class_orders/cifar100_b50_t10_afc_order1.json
  download: false

model:
  backbone: resnet32
  classifier_scale: 10.0
  learnable_scale: true

memory:
  exemplars_per_class: 2
  selection: herding

method:
  name: sacil_v0
  hierarchy:
    name: griffin_perona_greedy
    taxonomy_temperature: 0.20
  use_internal_anchors: true
  local_relaxation: true
  freeze_reference_anchors: true
  trainable_anchor: false
  lambda_geo: 1.0
  conflict:
    max_neighbors: 5
    old_class_ratio: 0.10
    temperature: 0.05
    min_preservation_weight: 0.10
    ancestor_decay: 0.50

training:
  batch_size: 32
  num_workers: 0
  pin_memory: true
  persistent_workers: false
  base:
    epochs: 1
    lr: 0.01
    momentum: 0.9
    weight_decay: 0.0005
    nesterov: true
    milestones: []
    gamma: 0.1
  incremental:
    epochs: 1
    lr: 0.005
    momentum: 0.9
    weight_decay: 0.0005
    nesterov: true
    milestones: []
    gamma: 0.1

debug:
  train_samples_per_class: 8
  test_samples_per_class: 4
  max_batches_per_epoch: 2

output:
  directory: outputs
  run_name: smoke_sacil_v0
