seed: 1
deterministic: true
device: cuda:0

data:
  name: cifar100
  root: datasets
  protocol: experiment_configs/class_orders/cifar100_b50_t10_afc_order1.json
  download: false

model:
  backbone: resnet18
  classifier_scale: 10.0
  learnable_scale: true

memory:
  exemplars_per_class: 20
  selection: herding

method:
  name: logit_kd_sacil_v0
  lambda_geo: 16.0
  logit_kd:
    temperature: 4.0
    weight: 1.0
  hierarchy:
    algorithm: griffin_perona_2008
    taxonomy_temperature: 0.2
  conflict:
    neighbors_per_new_class: 5
    temperature: 0.1
    min_leaf_weight: 0.1
    internal_floor: 0.5

training:
  batch_size: 128
  num_workers: 4
  pin_memory: true
  persistent_workers: true
  base:
    epochs: 160
    lr: 0.1
    momentum: 0.9
    weight_decay: 0.0005
    nesterov: true
    milestones: [80, 120]
    gamma: 0.1
  incremental:
    epochs: 80
    lr: 0.05
    momentum: 0.9
    weight_decay: 0.0005
    nesterov: true
    milestones: [40, 60]
    gamma: 0.1

output:
  directory: outputs
  run_name: cifar100_resnet18_logit_kd_sacil_v0_lgeo16_b50_inc5_20260730
