extends: evaluate_fgp_icl_affine.yaml

device: cuda:1
experiment:
  learner: FGP-ICL-population-mass-affine-transport
  output: outputs/cmpt/population_mass_affine/cifar100/fgp_icl/seed_1/results.json

cmpt:
  persistent_quadrature:
    enabled: true
    uniform_ridge: 0.001
    max_iterations: 1000
  population_mass_transport:
    enabled: true
    affine_ridge: 0.01
