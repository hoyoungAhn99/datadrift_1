extends: _training_baseline_common.yaml

# Stock PyCIL iCaRL optimizer schedule and old-logit KD semantics.
model:
  backbone: resnet32

method:
  name: icarl
  kd_temperature: 2.0
  kd_weight: 1.0

training:
  batch_size: 128
  base:
    epochs: 200
    lr: 0.1
    momentum: 0.9
    weight_decay: 0.0005
    nesterov: false
    scheduler: multistep
    milestones: [60, 120, 170]
    lr_decay: 0.1
  incremental:
    epochs: 170
    lr: 0.1
    momentum: 0.9
    weight_decay: 0.0002
    nesterov: false
    scheduler: multistep
    milestones: [80, 120]
    lr_decay: 0.1

output:
  run_name: icarl_common_c100_b50_inc5_r32
