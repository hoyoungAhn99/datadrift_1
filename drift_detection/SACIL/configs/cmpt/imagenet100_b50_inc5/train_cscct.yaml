extends: _training_common.yaml

# CSCCT author's ImageNet-Subset ResNet-18 architecture and optimization
# schedule under the shared B50-Inc5/order/memory/loader contract.
model:
  backbone: cscct_modified_resnet18_imagenet

method:
  name: cscct
  kd_weight: 0.25
  kd_temperature: 2.0
  csc_weight: 3.0
  ct_weight: 1.5
  ct_temperature: 2.0
  fusion_lr: 0.00000001

training:
  batch_size: 128
  base:
    epochs: 160
    lr: 0.1
    momentum: 0.9
    weight_decay: 0.0005
    nesterov: false
    scheduler: cosine
    fusion_scheduler: multistep
    fusion_milestones: [53, 106]
    fusion_lr_decay: 0.1
  incremental:
    epochs: 160
    lr: 0.1
    momentum: 0.9
    weight_decay: 0.0005
    nesterov: false
    scheduler: cosine
    fusion_scheduler: multistep
    fusion_milestones: [53, 106]
    fusion_lr_decay: 0.1

output:
  run_name: cscct_imagenet100_b50_inc5_r18
