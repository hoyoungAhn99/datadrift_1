extends: _common_b50_inc5.yaml
method:
  name: casper
  casper:
    # Paper experiment values (the parser defaults are not the reported
    # CIFAR-100 recipe): rho=0.001, k=8, p=8.
    weight: 0.001
    knn: 8
    classes_per_graph: 8
    replay_batch_size: 64
    solver: partial
    wd_reg: 0.00001
training:
  batch_size: 64
  base:
    epochs: 20
    lr: 0.3
    momentum: 0.0
    weight_decay: 0.0
    scheduler: multistep
    milestones: []
  incremental:
    epochs: 20
    lr: 0.3
    momentum: 0.0
    weight_decay: 0.0
    scheduler: multistep
    milestones: []
output:
  run_name: casper_paper_hparams_nme_c100_b50_inc5_r32
